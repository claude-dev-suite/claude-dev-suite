name: Claim

# Claiming an issue assigns it to whoever said so, or — when GitHub refuses the
# assignment, which it does for an account that has never interacted with the
# repository — records the claim as a label and a comment instead. Either way the
# next person to read the issue can see it is taken.
#
# It matches the `/claim` token anywhere in the comment, and the handful of
# phrasings people actually use instead. The first real claim this repository
# received was "I'd like to take this one", which the token-only version ignored
# — leaving the issue looking free while someone was working on it. Note the
# apostrophe: that comment used U+2019, so the patterns below deliberately avoid
# apostrophes entirely.

on:
  issue_comment:
    types: [created]
  # The collision job below needs a write token to answer a fork's PR, which the
  # plain `pull_request` event does not grant. `pull_request_target` does, and is
  # safe here only because nothing in this file checks out or runs the PR's code:
  # every step reads the API from the base repository's own checkout.
  pull_request_target:
    types: [opened, reopened, edited]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print what would happen, change nothing'
        type: boolean
        default: false

permissions:
  issues: write
  pull-requests: write

jobs:
  claim:
    if: >-
      github.repository_owner == 'claude-dev-suite' &&
      !github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      (
        contains(github.event.comment.body, '/claim') ||
        contains(github.event.comment.body, 'like to take this') ||
        contains(github.event.comment.body, 'like to work on this') ||
        contains(github.event.comment.body, 'll take this') ||
        contains(github.event.comment.body, 'can i take this') ||
        contains(github.event.comment.body, 'want to take this')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Record the claim
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          # Interpolated into the environment, never into the script body: a
          # comment is untrusted input and this job holds a write token.
          ACTOR: ${{ github.event.comment.user.login }}
          ASSIGNEES: ${{ join(github.event.issue.assignees.*.login, ' ') }}
        run: |
          set -euo pipefail

          if [ -n "${ASSIGNEES}" ] && ! echo " ${ASSIGNEES} " | grep -q " ${ACTOR} "; then
            holder=$(echo "${ASSIGNEES}" | awk '{print $1}')
            cat > taken.md <<EOF
          @${ACTOR} this one is already assigned to @${holder}.

          If it has gone quiet for a week, say so here and it's yours. Otherwise there are other [unclaimed good first issues](https://github.com/${REPO}/issues?q=is%3Aopen+label%3A%22good+first+issue%22+no%3Aassignee).
          EOF
            gh issue comment "${ISSUE}" --repo "${REPO}" --body-file taken.md
            exit 0
          fi

          gh label create 'claimed' \
            --description 'Someone is working on this' \
            --color '0e8a16' \
            --repo "${REPO}" || true

          assigned=$(gh api -X POST "repos/${REPO}/issues/${ISSUE}/assignees" \
            -f "assignees[]=${ACTOR}" \
            --jq '[.assignees[].login] | join(" ")' || echo '')

          gh issue edit "${ISSUE}" --repo "${REPO}" --add-label 'claimed'

          if echo " ${assigned} " | grep -q " ${ACTOR} "; then
            note="Assigned to you."
          else
            # GitHub only accepts assignees with write access; the label and this
            # comment are the record for everyone else.
            note="GitHub only accepts assignees with write access, so the \`claimed\` label and this comment are the record."
          fi

          cat > claimed.md <<EOF
          @${ACTOR} it's yours — thanks! ${note}

          Two things that help: [CONTRIBUTING.md → Your First Contribution](https://github.com/${REPO}/blob/main/CONTRIBUTING.md#your-first-contribution) lists the validation commands CI will run, and a comment here when you get stuck beats a silent abandon.

          If nothing happens for a week the issue goes back in the pool, no hard feelings.
          EOF
          gh issue comment "${ISSUE}" --repo "${REPO}" --body-file claimed.md

  # The other direction of the same question: `claim` records who owns an issue,
  # this tells a second contributor before they spend an evening on it.
  collision:
    if: >-
      github.repository_owner == 'claude-dev-suite' &&
      github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      # Base repository only. `pull_request_target` would happily check out the
      # PR's head with a write token in scope; it must not.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Ensure the label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh label create 'claim-collision'             --description 'Closes an issue someone else already claimed'             --color 'fbca04'             --repo "${REPO}" || true

      - name: Flag PRs that close a claimed issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/check-pr-claim-collision.mjs             ${{ inputs.dry_run && '--dry-run' || '' }}
