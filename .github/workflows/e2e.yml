name: E2E Tests

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: configurator/dashboard

      - name: Install server dependencies
        run: npm ci
        working-directory: configurator/dashboard/server

      - name: Build server
        run: npm run build
        working-directory: configurator/dashboard/server

      - name: Build frontend
        run: npm run build
        working-directory: configurator/dashboard

      - name: Install MCP server dependencies
        run: npm ci
        working-directory: mcp-servers

      - name: Build MCP servers
        run: npm run build
        working-directory: mcp-servers

      - name: Run Playwright E2E tests (shard ${{ matrix.shard }}/6)
        run: npx playwright test --reporter=github,list --shard=${{ matrix.shard }}/6
        working-directory: configurator/dashboard

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-results-${{ matrix.shard }}
          path: configurator/dashboard/e2e-results/
          retention-days: 7
