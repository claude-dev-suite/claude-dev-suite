name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: configurator/dashboard

      - name: Install server dependencies
        run: npm ci
        working-directory: configurator/dashboard/server

      - name: Build server
        run: npm run build
        working-directory: configurator/dashboard/server

      - name: Install MCP server dependencies
        run: npm ci
        working-directory: mcp-servers

      - name: Build MCP servers
        run: npm run build
        working-directory: mcp-servers

      - name: Audit MCP tool descriptions (token budget)
        run: node scripts/audit-mcp-descriptions.mjs

      - name: Validate component catalog
        run: node scripts/validate-catalog.mjs

      - name: Validate component frontmatter
        run: node scripts/validate-frontmatter.mjs

      # Without this, an unmarked credential in metadata.json is written into MCP
      # config files that the narrowed .gitignore block no longer covers.
      - name: Validate MCP env secret flags
        run: node scripts/validate-env-secrets.mjs

      - name: Check shared type sync
        run: node scripts/check-type-sync.mjs

      - name: Check generated agent docs are current
        run: |
          node scripts/gen-capability-matrix.mjs --check
          node scripts/gen-agents-reference.mjs --check

      - name: Check docs match the wizard and target registry
        run: node scripts/check-docs-sync.mjs

      - name: Lint
        run: npm run lint
        working-directory: configurator/dashboard

      - name: Typecheck and build frontend
        run: npm run build
        working-directory: configurator/dashboard

      - name: Test (server)
        run: npx vitest run
        working-directory: configurator/dashboard/server

      - name: Test (frontend)
        run: npx vitest run
        working-directory: configurator/dashboard

      - name: Test (MCP servers)
        run: npm run test
        working-directory: mcp-servers

      # The npm package for `npx @claude-dev-suite/cli`. Building it checks the
      # bundle is self-contained and every MCP server has a dist/; the smoke run
      # exercises the packaged layout (catalog beside dist/), which the server
      # tests — run from the checkout — cannot reach.
      - name: Build command-line package
        run: npm ci && npm run build && npm run catalog
        working-directory: cli

      - name: Smoke-test command-line package
        working-directory: cli
        shell: bash
        run: |
          set -euo pipefail
          proj=$(mktemp -d)
          printf '{"name":"smoke","dependencies":{"react":"^19.0.0"}}' > "$proj/package.json"
          node dist/cli.js --version
          node dist/cli.js init "$proj" --dry-run --json > plan.json
          node -e "const p=require('./plan.json').plan; if(!p.agents.includes('react-expert')) { console.error(p); process.exit(1) }"
          node dist/cli.js init "$proj" --yes --json > result.json
          test -f "$proj/AGENTS.md"
          test -f "$proj/.dev-suite-manifest.json"
          test -f "$proj/.mcp-servers/documentation/dist/index.js"
