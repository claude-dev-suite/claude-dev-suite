name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: configurator/dashboard

      - name: Install server dependencies
        run: npm ci
        working-directory: configurator/dashboard/server

      - name: Build server
        run: npm run build
        working-directory: configurator/dashboard/server

      - name: Install MCP server dependencies
        run: npm ci
        working-directory: mcp-servers

      - name: Build MCP servers
        run: npm run build
        working-directory: mcp-servers

      - name: Audit MCP tool descriptions (token budget)
        run: node scripts/audit-mcp-descriptions.mjs

      - name: Validate component catalog
        run: node scripts/validate-catalog.mjs

      - name: Check shared type sync
        run: node scripts/check-type-sync.mjs

      - name: Check generated agent docs are current
        run: |
          node scripts/gen-capability-matrix.mjs --check
          node scripts/gen-agents-reference.mjs --check

      - name: Check docs match the wizard and target registry
        run: node scripts/check-docs-sync.mjs

      - name: Lint
        run: npm run lint
        working-directory: configurator/dashboard

      - name: Typecheck and build frontend
        run: npm run build
        working-directory: configurator/dashboard

      - name: Test (server)
        run: npx vitest run
        working-directory: configurator/dashboard/server

      - name: Test (frontend)
        run: npx vitest run
        working-directory: configurator/dashboard

      - name: Test (MCP servers)
        run: npm run test
        working-directory: mcp-servers
