name: Metrics

# Snapshots the traffic statistics GitHub discards after 14 days.
#
# The GH_TOKEN PAT is doing two jobs here, both of which the Actions GITHUB_TOKEN
# cannot do. Reading traffic requires push access, and GITHUB_TOKEN has no
# `administration` permission to grant. Pushing the snapshot to main requires
# bypassing the `pull_request` rule on that branch, and only the repository admin
# is a bypass actor — github-actions[bot] is not, so a checkout with the default
# token would fail at the push with a ruleset violation.

on:
  schedule:
    # Monday 06:30 UTC. Weekly is enough: the API window is 14 days, so nothing
    # is lost as long as two consecutive runs don't both fail.
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  traffic:
    if: github.repository_owner == 'claude-dev-suite'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The push at the end of this job uses whatever credential checkout
          # stored, so it has to be the PAT rather than GITHUB_TOKEN.
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Collect traffic
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/collect-traffic.mjs

      - name: Commit the snapshot
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/metrics
          if git diff --cached --quiet; then
            echo 'No change in the traffic snapshot.'
            exit 0
          fi
          git commit -m 'chore(metrics): weekly traffic snapshot [skip ci]'
          git push
