# Dev-Suite Dashboard Release Workflow
#
# Builds installers for Windows (NSIS .exe), macOS (DMG arm64 + x64) and Linux
# (AppImage + .deb + .rpm) and attaches them to the GitHub Release.
#
# Triggers on: push of tags matching v* (e.g., v1.0.0, v1.2.3)
#
# Release flow:
#   1. Create a tag: git tag -a v1.0.0 -m "v1.0.0"
#   2. Push: git push origin v1.0.0
#   3. This workflow cleans old assets, builds per-platform, and uploads.
#
# Re-running on the same tag will clean old assets before uploading.
#
# Artifacts produced per platform:
#   Windows : *Setup*.exe, *.exe.blockmap, latest.yml
#   macOS   : *-arm64.dmg, *-x64.dmg (+ blockmaps), latest-mac.yml
#   Linux   : *.AppImage, *.deb, latest-linux.yml
#
# Builds are unsigned (Apple Developer ID / Windows code-signing cert not configured).
# macOS users must right-click → Open or run `xattr -d com.apple.quarantine` on first launch.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  clean-assets:
    name: Clean previous release assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Ensure release exists, then strip old assets
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "Preparing release $VERSION"
          # A semver pre-release tag carries a hyphen (v1.14.0-rc.1). Publishing
          # one as a normal release makes it "Latest", and electron-updater then
          # offers it to everyone on the stable channel — the opposite of what an
          # rc is for. Mark it, so validating a candidate cannot ship it.
          PRERELEASE=""
          case "$VERSION" in
            *-*) PRERELEASE="--prerelease" ;;
          esac

          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION does not exist yet — creating it${PRERELEASE:+ as a pre-release}"
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes "Automated release — assets uploaded by CI." \
              --draft=false $PRERELEASE
          elif [ -n "$PRERELEASE" ]; then
            # Created by hand, or by an earlier run before this guard existed.
            echo "Ensuring $VERSION is flagged as a pre-release"
            gh release edit "$VERSION" --prerelease
          fi
          gh release view "$VERSION" --json assets --jq '.assets[].name' | while read -r name; do
            echo "Deleting: $name"
            gh release delete-asset "$VERSION" "$name" --yes
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build ${{ matrix.platform }} (${{ matrix.os }})
    needs: clean-assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            eb_args: --win nsis --x64
          - os: macos-latest
            platform: mac
            eb_args: --mac dmg --arm64 --x64
          - os: ubuntu-latest
            platform: linux
            eb_args: --linux AppImage deb --x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: configurator/dashboard/package-lock.json

      - name: Install Linux packaging deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot

      - name: Install dashboard dependencies
        working-directory: configurator/dashboard
        run: npm ci

      - name: Install server dependencies
        working-directory: configurator/dashboard/server
        run: npm ci

      - name: Build server
        working-directory: configurator/dashboard/server
        # build:prod uses tsconfig.build.json (sourceMap:false) so shipped server
        # bundles do not leak original TS source / paths via .map files.
        run: npm run build:prod

      - name: Install MCP servers dependencies
        working-directory: mcp-servers
        run: npm ci

      - name: Build MCP servers
        working-directory: mcp-servers
        run: npm run build

      - name: Download bundled Node.js (Windows x64)
        if: matrix.os == 'windows-latest'
        working-directory: configurator/dashboard
        shell: bash
        run: |
          NODE_VERSION="20.11.1"
          FILENAME="node-v${NODE_VERSION}-win-x64.zip"
          curl -fL --retry 5 --retry-delay 10 --retry-connrefused -o node.zip \
            "https://nodejs.org/dist/v${NODE_VERSION}/${FILENAME}"
          # Verify integrity: fetch the official SHASUMS256.txt and check our download
          curl -fL --retry 3 -o SHASUMS256.txt \
            "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt"
          # grep for the exact filename line and verify (sha256sum -c checks <hash>  <file> format)
          grep " ${FILENAME}$" SHASUMS256.txt | sed "s/${FILENAME}/node.zip/" | sha256sum -c -
          rm SHASUMS256.txt
          unzip -q node.zip
          rm -rf node-x64
          mv "node-v${NODE_VERSION}-win-x64" node-x64
          rm node.zip

      - name: Ensure npm is available in bundled Node (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: configurator/dashboard
        shell: bash
        run: |
          NPM_CLI="node-x64/node_modules/npm/bin/npm-cli.js"
          if [ ! -f "$NPM_CLI" ]; then
            echo "npm-cli.js not found in bundled node — copying from system npm..."
            SYSTEM_NPM=$(npm root -g)/npm
            mkdir -p node-x64/node_modules
            cp -r "$SYSTEM_NPM" node-x64/node_modules/npm
          fi
          ls "$NPM_CLI"
          echo "npm-cli.js OK"

      - name: Download bundled Node.js (macOS arm64 + x64)
        if: matrix.os == 'macos-latest'
        working-directory: configurator/dashboard
        run: |
          NODE_VERSION="20.11.1"
          # Fetch the official checksum file once for both architectures
          curl -fL --retry 3 -o SHASUMS256.txt \
            "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt"
          for ARCH in arm64 x64; do
            FILENAME="node-v${NODE_VERSION}-darwin-${ARCH}.tar.gz"
            LOCALFILE="node-darwin-${ARCH}.tar.gz"
            curl -fL --retry 5 --retry-delay 10 --retry-connrefused \
              -o "${LOCALFILE}" \
              "https://nodejs.org/dist/v${NODE_VERSION}/${FILENAME}"
            # Verify integrity using macOS shasum (shasum -a 256 -c)
            grep " ${FILENAME}$" SHASUMS256.txt | sed "s/${FILENAME}/${LOCALFILE}/" | shasum -a 256 -c -
            tar -xf "${LOCALFILE}"
            rm -rf "node-${ARCH}"
            mv "node-v${NODE_VERSION}-darwin-${ARCH}" "node-${ARCH}"
            rm "${LOCALFILE}"
            test -x "node-${ARCH}/bin/node" || { echo "missing node binary for ${ARCH}"; exit 1; }
          done
          rm SHASUMS256.txt

      - name: Download bundled Node.js (Linux x64)
        if: matrix.os == 'ubuntu-latest'
        working-directory: configurator/dashboard
        run: |
          NODE_VERSION="20.11.1"
          FILENAME="node-v${NODE_VERSION}-linux-x64.tar.xz"
          curl -fL --retry 5 --retry-delay 10 --retry-connrefused \
            -o node-linux-x64.tar.xz \
            "https://nodejs.org/dist/v${NODE_VERSION}/${FILENAME}"
          # Verify integrity: fetch SHASUMS256.txt and check with sha256sum
          curl -fL --retry 3 -o SHASUMS256.txt \
            "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt"
          grep " ${FILENAME}$" SHASUMS256.txt | sed "s/${FILENAME}/node-linux-x64.tar.xz/" | sha256sum -c -
          rm SHASUMS256.txt
          tar -xf node-linux-x64.tar.xz
          rm -rf node-x64
          mv "node-v${NODE_VERSION}-linux-x64" node-x64
          rm node-linux-x64.tar.xz
          test -x node-x64/bin/node

      - name: Build frontend
        working-directory: configurator/dashboard
        run: npm run build

      - name: Build Electron installer
        working-directory: configurator/dashboard
        # --publish never: disable electron-builder's implicit "create release from version" behaviour.
        # We upload assets manually below (see "Upload artifacts to release") so we control exactly
        # which release tag receives them (e.g. v1.9.0-rc.1) instead of the bare semver (v1.9.0).
        run: npx electron-builder ${{ matrix.eb_args }} --publish never
        env:
          # Avoid electron-builder probing the keychain for a Developer ID — we ship unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifacts to release
        shell: bash
        working-directory: configurator/dashboard
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF#refs/tags/}
          shopt -s nullglob

          declare -a FILES
          case "${{ matrix.platform }}" in
            win)
              FILES=(dist-electron/*Setup*.exe dist-electron/*Setup*.exe.blockmap dist-electron/latest.yml)
              ;;
            mac)
              FILES=(dist-electron/*.dmg dist-electron/*.dmg.blockmap dist-electron/latest-mac.yml)
              ;;
            linux)
              FILES=(dist-electron/*.AppImage dist-electron/*.deb dist-electron/latest-linux.yml)
              ;;
          esac

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::No artifacts matched for platform ${{ matrix.platform }}"
            ls -la dist-electron
            exit 1
          fi

          for f in "${FILES[@]}"; do
            echo "Uploading: $f"
            gh release upload "$VERSION" "$f" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
