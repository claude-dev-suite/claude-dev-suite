# Dev-Suite Dashboard Release Workflow
#
# Builds the NSIS installer .exe and attaches it to the GitHub Release.
#
# Triggers on: push of tags matching v* (e.g., v1.0.0, v1.2.3)
#
# Release flow:
#   1. Create a tag: git tag -a v1.0.0 -m "v1.0.0"
#   2. Push: git push origin v1.0.0
#   3. This workflow builds and uploads the .exe to the release
#
# Re-running on the same tag will clean old assets before uploading.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: configurator/dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: configurator/dashboard
        run: npm ci

      - name: Install server dependencies
        working-directory: configurator/dashboard/server
        run: npm ci

      - name: Build server
        working-directory: configurator/dashboard/server
        run: npm run build

      - name: Install MCP servers dependencies
        working-directory: mcp-servers
        run: npm ci

      - name: Build MCP servers
        working-directory: mcp-servers
        run: npm run build

      - name: Download bundled Node.js
        working-directory: configurator/dashboard
        shell: bash
        run: |
          NODE_VERSION="20.11.1"
          NODE_URL="https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-win-x64.zip"
          curl -fL --retry 5 --retry-delay 10 --retry-connrefused -o node.zip "$NODE_URL"
          unzip -q node.zip
          rm -rf node
          mv "node-v${NODE_VERSION}-win-x64" node
          rm node.zip

      - name: Ensure npm is available in bundled Node
        working-directory: configurator/dashboard
        shell: bash
        run: |
          NPM_CLI="node/node_modules/npm/bin/npm-cli.js"
          if [ ! -f "$NPM_CLI" ]; then
            echo "npm-cli.js not found in bundled node — copying from system npm..."
            SYSTEM_NPM=$(npm root -g)/npm
            mkdir -p node/node_modules
            cp -r "$SYSTEM_NPM" node/node_modules/npm
          fi
          ls "$NPM_CLI"
          echo "npm-cli.js OK"

      - name: Build frontend
        working-directory: configurator/dashboard
        run: npm run build

      - name: Build Electron installer
        working-directory: configurator/dashboard
        run: npx electron-builder --win nsis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean old release assets
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "Cleaning old assets from release $VERSION"
          gh release view "$VERSION" --json assets --jq '.assets[].name' | while read -r name; do
            echo "Deleting: $name"
            gh release delete-asset "$VERSION" "$name" --yes
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer to release
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          EXE=$(find configurator/dashboard/dist-electron -name "*Setup*.exe" | head -1)
          echo "Uploading $EXE to release $VERSION"
          gh release upload "$VERSION" "$EXE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
