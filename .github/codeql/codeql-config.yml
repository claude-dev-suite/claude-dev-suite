# CodeQL analysis configuration.
#
# `packs` lists the query packs to run.
#
# This repository's own pack is NOT listed here. It contains no queries — only
# `barrierModel` data extensions — and `packs:` loads a pack as a *query* pack,
# which for a query-less pack is a no-op. It is passed instead as
# `--extension-packs` through CODEQL_ACTION_EXTRA_OPTIONS in
# .github/workflows/codeql.yml, and found via the `--search-path` set there.
packs:
  javascript-typescript:
    - codeql/javascript-queries
